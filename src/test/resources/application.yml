spring:
  application:
    name: steamfolder-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 완전히 격리된 테스트 전용 더미 키 (실제 비밀키와 무관)
  secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtb25seS1wbGVhc2UtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTIwMjYwODI0
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 604800
