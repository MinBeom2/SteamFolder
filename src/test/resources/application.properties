spring.application.name=steamfolder-test

# Test Database Configuration (H2 In-Memory)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Test JWT Configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtb25seS1wbGVhc2UtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTIwMjYwODI0
jwt.access-token-expiration-seconds=3600
jwt.refresh-token-expiration-seconds=604800

# Steam Web API Key
steam.api.key=test-steam-api-key
