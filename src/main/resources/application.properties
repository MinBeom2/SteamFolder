spring.application.name=steamfolder

# ==============================================================================
# Monitoring / Actuator Configuration
# ==============================================================================
# Only health is exposed. Details stay private while liveness/readiness probes remain public.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,diskSpace

# Discord alert delivery is disabled unless a webhook is explicitly configured.
monitoring.health.enabled=${MONITORING_HEALTH_ENABLED:true}
monitoring.health.initial-delay-ms=${MONITORING_HEALTH_INITIAL_DELAY_MS:30000}
monitoring.health.check-interval-ms=${MONITORING_HEALTH_CHECK_INTERVAL_MS:60000}
monitoring.discord.enabled=${DISCORD_WEBHOOK_ENABLED:false}
monitoring.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
monitoring.discord.environment=${APP_ENV:local}
monitoring.discord.cooldown=${DISCORD_ALERT_COOLDOWN:5m}
monitoring.discord.request-timeout=${DISCORD_WEBHOOK_TIMEOUT:3s}
monitoring.discord.max-message-length=1900
monitoring.discord.max-stack-trace-length=1200

# ==============================================================================
# Feedback AI Analysis (OpenAI) Configuration
# ==============================================================================
# Feedback is saved first; analysis runs asynchronously after commit.
feedback.analysis.enabled=${FEEDBACK_ANALYSIS_ENABLED:false}
feedback.analysis.openai-url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
feedback.analysis.openai-api-key=${OPENAI_API_KEY:}
feedback.analysis.openai-model=${OPENAI_FEEDBACK_MODEL:gpt-6-luna}
feedback.analysis.request-timeout=${OPENAI_FEEDBACK_TIMEOUT:30s}
feedback.analysis.max-attempts=${FEEDBACK_ANALYSIS_MAX_ATTEMPTS:3}
feedback.analysis.recovery-initial-delay-ms=${FEEDBACK_ANALYSIS_RECOVERY_INITIAL_DELAY_MS:30000}
feedback.analysis.recovery-interval-ms=${FEEDBACK_ANALYSIS_RECOVERY_INTERVAL_MS:60000}
feedback.analysis.stale-processing-after=${FEEDBACK_ANALYSIS_STALE_AFTER:5m}
feedback.analysis.recovery-batch-size=${FEEDBACK_ANALYSIS_BATCH_SIZE:20}
feedback.analysis.max-summary-length=1000
feedback.analysis.daily-summary-cron=${FEEDBACK_DAILY_SUMMARY_CRON:0 0 9 * * *}
feedback.analysis.daily-summary-zone=${FEEDBACK_DAILY_SUMMARY_ZONE:Asia/Seoul}
feedback.analysis.daily-summary-batch-size=${FEEDBACK_DAILY_SUMMARY_BATCH_SIZE:10}
feedback.analysis.daily-summary-max-items=${FEEDBACK_DAILY_SUMMARY_MAX_ITEMS:100}

# ==============================================================================
# Secret Configuration (Optional local secret properties or system environment variables)
# ==============================================================================
spring.config.import=optional:classpath:application-secret.properties

# ==============================================================================
# Database Configuration (MySQL 8.x Default)
# ==============================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/steamfolder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET:dGhpc2lzYXNlY3JldGtleWZvcnN0ZWFtZm9sZGVycHJvamVjdHBsZWFzZWtlZXBpdHNhZmUyMDI2MDgyNA==}
jwt.access-token-expiration-seconds=3600
jwt.refresh-token-expiration-seconds=604800

# ==============================================================================
# Steam Web API Configuration
# ==============================================================================
steam.api.key=${STEAM_API_KEY:}

# ==============================================================================
# Rate Limit Configuration
# ==============================================================================
# Redis connection uses Spring Boot standard variables such as SPRING_DATA_REDIS_HOST.
# X-Forwarded-For is trusted only when the direct peer belongs to this CIDR list.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.trusted-proxy-cidrs=${RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
