# Use an isolated local database because schema creation removes existing tables.
spring.datasource.url=jdbc:mysql://localhost:3306/steamfolder_ranking_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.hbm2ddl.import_files=ranking-demo.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=multi-line
